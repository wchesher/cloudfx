<!-- kit - Take the assessment (served at /assessment): consent, a person code, 50 statements, 6 situations, 4 messages, one task per screen; Finish records the agreement and opens Your file on the review (with the workbench and AI consent, both answer files go to the team hub first; nothing to download) -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Take the assessment · lumin8r</title>
<meta name="description" content="Take the lumin8r assessment: about 20 to 30 minutes, no right answers, skip anything. Your progress is saved as you go.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="/static/mefile.css">
<style>
  .kit { max-width: 720px; margin: 0 auto; padding: var(--s-7) 16px 160px; display: grid; gap: var(--s-5); grid-template-columns: minmax(0, 1fr); }
  .kit > section { display: grid; gap: var(--s-5); grid-template-columns: minmax(0, 1fr); }
  .kit h1 { font-size: clamp(30px, 6vw, 40px); line-height: 1.12; }
  [tabindex="-1"]:focus { outline: none; }
  .intro { display: grid; gap: var(--s-3); }

  /* the path bar: sections, a gentle progress line, time left */
  .kitbar { display: grid; gap: 0; grid-template-columns: minmax(0, 1fr); }
  .kitbar > * { min-width: 0; }
  .kitbar .pathbar { border-top: 0; }
  .kitprogress { height: 3px; background: var(--line); }
  .kitprogress i { display: block; height: 100%; width: 0; background: var(--glow); box-shadow: 0 0 8px var(--glow-ring); transition: width var(--t-slow) var(--ease); }
  .steplabel { font: 500 var(--t-sm)/1 var(--body); color: var(--muted); white-space: nowrap; }
  .steplabel b { color: var(--ink); font-weight: 600; }
  .timer { font: 500 var(--t-sm)/1 var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; }
  .timer:empty { display: none; }
  .stations.compact .st .n { width: 22px; height: 22px; }
  @media (max-width: 640px) { .stations.compact .st:not(.on) .lbl { display: none; } .stations.compact li + li::before { width: 8px; margin: 0; } .stations.compact .st { padding: 0 4px; } .stations.compact .st.on { padding: 0 10px 0 4px; } }

  .reassure { display: flex; flex-wrap: wrap; gap: var(--s-2); }
  .copy { display: grid; gap: var(--s-3); grid-template-columns: minmax(0, 1fr); }
  .copy h2 { font: 600 var(--t-lg)/1.35 var(--body); margin-top: var(--s-4); }
  .copy p, .copy li { color: var(--ink-2); line-height: 1.65; max-width: var(--measure); }
  .copy b { color: var(--ink); font-weight: 600; }
  .copy ul, .copy ol { margin: 0; padding-left: 22px; display: grid; gap: var(--s-2); }
  .choices { display: grid; gap: var(--s-3); }
  .choices > h2 { font: 600 var(--t-lg)/1.35 var(--body); margin-top: var(--s-3); }
  .choice { display: grid; gap: var(--s-2); padding: var(--s-4) var(--s-5); border: 1px solid var(--line-2); border-radius: var(--radius); background: var(--panel); transition: border-color var(--t-fast) var(--ease), background-color var(--t-fast) var(--ease); }
  .choice:has(input:checked) { border-color: var(--ink); box-shadow: 0 0 0 1px var(--ink); }
  .choice-head { font-size: var(--t-sm); font-weight: 600; color: var(--ink); display: flex; gap: var(--s-2); align-items: center; flex-wrap: wrap; }
  .choice label.check b { font-weight: 600; }
  .heldout { display: grid; gap: var(--s-1); }
  .tips { margin: 0; padding: 0; list-style: none; display: grid; gap: var(--s-3); }
  .tips li { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: var(--s-3); color: var(--ink-2); }
  .tips li::before { content: ""; width: 22px; height: 22px; border-radius: 50%; background: var(--panel-2) radial-gradient(circle, var(--glow) 3px, transparent 3.5px); border: 1px solid var(--line); }
  .field input { width: 100%; max-width: 340px; font-family: var(--mono); letter-spacing: .02em; }
  .err { color: var(--caution); font-size: var(--t-sm); }
  .err:empty { display: none; }
  fieldset { border: 0; margin: 0; padding: 0; min-width: 0; }

  /* statements: one calm card each, a five-step scale and a skip */
  .scalekey { display: flex; justify-content: space-between; gap: var(--s-3); font-size: var(--t-sm); color: var(--muted); padding: 0 2px; }
  .item { display: grid; gap: var(--s-3); padding: var(--s-4) var(--s-5); background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); scroll-margin-top: 140px; box-shadow: var(--shadow-1); }
  .item legend { display: contents; }
  .item .q { display: flex; gap: var(--s-3); align-items: baseline; color: var(--ink); font-size: 17px; line-height: 1.45; font-weight: 500; }
  .id { font: 400 12px/1.4 var(--mono); color: var(--faint); flex: none; }
  .seg { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)) minmax(0, 1.1fr); gap: var(--s-2); }
  .seg label { position: relative; display: grid; place-items: center; height: 44px; border: 1px solid var(--line-2); border-radius: var(--radius-sm); background: var(--panel); cursor: pointer; font: 600 15px/1 var(--body); color: var(--ink-2); transition: background-color var(--t-fast) var(--ease), border-color var(--t-fast) var(--ease), color var(--t-fast) var(--ease); }
  .seg label.skip { font: 500 var(--t-sm)/1 var(--body); color: var(--muted); border-style: dashed; }
  .seg input { position: absolute; opacity: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; }
  .seg label:hover { border-color: var(--field); background: var(--panel-2); }
  .seg label:has(input:focus-visible) { box-shadow: var(--focus); }
  .seg label:has(input:checked) { background: var(--action); border-color: var(--action); color: var(--action-ink); box-shadow: 0 0 0 4px var(--glow-soft); }
  .seg label.skip:has(input:checked) { background: var(--surface-2); border-color: var(--field); border-style: solid; color: var(--ink); }

  /* situations and messages */
  .scen { display: grid; gap: var(--s-3); padding: var(--s-5); background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius-lg); scroll-margin-top: 140px; box-shadow: var(--shadow-1); }
  .scen .head { display: flex; gap: var(--s-2); align-items: center; flex-wrap: wrap; }
  .scen .wording { color: var(--ink); font-size: 17px; line-height: 1.5; font-weight: 500; }
  .opts { display: grid; gap: var(--s-2); }
  .opt { display: grid; grid-template-columns: 18px 20px minmax(0, 1fr); gap: var(--s-3); align-items: start; padding: var(--s-3) var(--s-4); border: 1px solid var(--line-2); border-radius: var(--radius-sm); background: var(--panel); cursor: pointer; color: var(--ink-2); transition: background-color var(--t-fast) var(--ease), border-color var(--t-fast) var(--ease); }
  .opt:hover { border-color: var(--field); }
  .opt input { margin: 3px 0 0; }
  .opt .L { font: 500 13px/1.6 var(--mono); color: var(--muted); }
  .opt:has(input:checked) { border-color: var(--ink); box-shadow: 0 0 0 1px var(--ink); color: var(--ink); }
  .opt:has(input:focus-visible) { box-shadow: var(--focus); }
  .chip.test { border-color: var(--caution-line); background: var(--caution-soft); color: var(--caution); }
  .count { font: 400 12px/1 var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; }
  .count.over { color: var(--caution); }
  .row { display: flex; gap: var(--s-3); flex-wrap: wrap; align-items: center; }
  .between { display: flex; gap: var(--s-2); flex-wrap: wrap; align-items: baseline; justify-content: space-between; }
  .between label { font-size: var(--t-sm); font-weight: 600; color: var(--ink); }

  /* review and done */
  .list { display: flex; flex-wrap: wrap; gap: var(--s-2); }
  .list button { font: 500 12px/1 var(--mono); color: var(--ink-2); background: var(--panel); border: 1px solid var(--line-2); border-radius: var(--radius-pill); padding: 8px 12px; cursor: pointer; transition: border-color var(--t-fast) var(--ease), color var(--t-fast) var(--ease); }
  .list button:hover { border-color: var(--field); color: var(--ink); }
  .list button:focus-visible { box-shadow: var(--focus); outline: none; }
  .flags { margin: 0; padding-left: 20px; display: grid; gap: var(--s-1); color: var(--ink-2); font-size: var(--t-sm); }
  .stat { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: var(--s-3); }
  .stat div { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: var(--s-4); display: grid; gap: var(--s-1); }
  .stat b { font: 600 30px/1 var(--display); letter-spacing: -0.04em; color: var(--ink); }
  .stat span { font-size: var(--t-sm); color: var(--muted); }
  .result { border-radius: var(--radius); padding: var(--s-3) var(--s-4); font-size: var(--t-sm); line-height: 1.55; }
  .result > * + * { margin-top: var(--s-2); }
  .result b { display: block; }
  .result.ok { border: 1px solid var(--accent-line); background: var(--accent-wash); color: var(--ink); }
  .result.warn { border: 1px solid var(--caution-line); background: var(--caution-soft); color: var(--ink); }
  .result.bad { border: 1px solid var(--bad-line); background: var(--bad-soft); color: var(--ink); }
  .confirm { border: 1px solid var(--line-2); background: var(--panel); border-radius: var(--radius); padding: var(--s-4); display: grid; gap: var(--s-3); box-shadow: var(--shadow-2); }
  .footline { border-top: 1px solid var(--line); padding-top: var(--s-4); margin-top: var(--s-3); display: flex; gap: var(--s-3); flex-wrap: wrap; align-items: center; justify-content: space-between; }
  .donecard { display: grid; gap: var(--s-4); padding: var(--s-6); border-radius: var(--radius-lg); background: var(--panel); border: 1px solid var(--line); box-shadow: var(--shadow-2); }
  .donecard .switch { align-items: flex-start; }
  .donecard .switch span { display: grid; gap: 2px; }
  .donecard .switch input { margin-top: 2px; }
  .secondary { display: grid; gap: var(--s-3); }
  .actionbar .btn.big { min-width: 0; }
  @media (max-width: 520px) {
    .kit { padding-top: var(--s-5); }
    .seg { grid-template-columns: repeat(5, minmax(0, 1fr)); }
    .seg label.skip { grid-column: 1 / -1; height: 38px; }
    .item, .scen { padding: var(--s-4); }
    .donecard { padding: var(--s-5); }
    .actionbar .btn.big { flex: 1 1 0; padding: 0 var(--s-4); }
  }
</style>
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>
<header class="topbar">
  <div class="topbar-row">
    <a class="wordmark" href="/" aria-label="lumin8r home">
      <svg class="mark" viewBox="0 0 32 32" aria-hidden="true"><rect class="mark-sheet" x="3.5" y="3" width="19" height="25" rx="5"/><path class="mark-line" d="M8.5 10h9M8.5 15h5.5"/><path class="mark-thread" d="M14 15c6.5 0 6 8 12 8"/><circle class="mark-dot" cx="27" cy="23" r="3"/></svg>
      <b>lumin8r</b>
    </a>
    <nav class="sitenav" aria-label="Site">
      <a class="nav-home" href="/">Home</a>
      <a href="/assessment" aria-current="page"><span class="long">Take the assessment</span><span class="short">Assessment</span></a>
      <a href="/app"><span class="long">Your file</span><span class="short">Your file</span></a>
    </nav>
  </div>
  <div class="kitbar">
    <div class="pathbar">
      <ol class="stations compact" id="kitpath" aria-label="Assessment sections"></ol>
      <div class="pathend"><span class="steplabel" id="steplabel" aria-live="polite"></span><span class="timer" id="kittimer" role="timer" aria-label="time since your first answer"></span></div>
    </div>
    <div class="kitprogress" role="progressbar" id="kitprogress" aria-label="Assessment progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><i></i></div>
  </div>
</header>

<main class="kit" id="main" tabindex="-1"></main>

<div class="actionbar" id="actionbar" role="group" aria-label="Move through the assessment">
  <span class="hint" id="nexthint" aria-live="polite"></span>
  <button class="btn big" id="back" type="button">Back</button>
  <button class="btn big hidden" id="openFile" type="button">Open your file</button>
  <button class="btn primary big" id="next" type="button" disabled>Next</button>
</div>

<script id="kit-data" type="application/json">__KIT_DATA__</script>
<script src="/static/context.js"></script>
<script>
(async () => {
  "use strict";
  await CTX.ready;  // saved progress on the server (context.js); nothing is kept in browser storage
  const KIT = JSON.parse(document.getElementById("kit-data").textContent);
  const ITEM_IDS = Object.keys(KIT.items).sort();
  const SCEN_IDS = Object.keys(KIT.scenarios).sort();
  const WRIT_IDS = Object.keys(KIT.writing).sort();
  const TEST = new Set(KIT.test_ids);
  const PAGE = 10;
  const ITEM_PAGES = Math.ceil(ITEM_IDS.length / PAGE);
  const CODE_RE = /^[A-Za-z0-9_-]{2,32}$/;
  const STORE = "lumin8r-kit-v1";
  const HANDOFF = "lumin8r-answers-v1";   // read by /app: the build answers, in this tab (and on this device if remembered)
  const REMEMBER = "lumin8r-remember";
  const CONSENT = "lumin8r-consent-v1";   // read by /app: the agreement recorded here, so Your file opens straight to the review
  const STEPS = ["consent", "code"].concat(Array.from({ length: ITEM_PAGES }, (_, i) => "items" + i), ["scenarios", "writing", "review", "done"]);
  let WB = false; // the workbench (team evaluation) is on only when /api/config says so

  const blank = () => ({ step: 0, consented: false, aiConsented: false, remember: true, code: "", items: {}, scenarios: {}, writing: {}, startedAt: null, finishedAt: null, sent: null });
  let state = blank();
  try { const saved = JSON.parse(CTX.localStorage.getItem(STORE) || "null"); if (saved && typeof saved === "object") state = Object.assign(blank(), saved); } catch (_) {}
  state.remember = true;  // progress is always saved on the server; there is no per-device choice any more
  const save = () => { try { CTX.localStorage.setItem(STORE, JSON.stringify(state)); } catch (_) {} };

  const main = document.getElementById("main");
  const back = document.getElementById("back");
  const next = document.getElementById("next");
  const openBtn = document.getElementById("openFile");
  const steplabel = document.getElementById("steplabel");
  let flash = "";
  let confirming = false;
  let sendResult = null;

  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const cap = (s) => String(s).charAt(0).toUpperCase() + String(s).slice(1);
  const words = (s) => String(s || "").trim().split(/\s+/).filter(Boolean).length;
  const scenWords = (id) => { const a = state.scenarios[id] || {}; return words(a.explanation) + (a.choice ? 1 : 0); };
  const minutes = () => state.startedAt ? Math.round(((state.finishedAt || Date.now()) - state.startedAt) / 6000) / 10 : 0;
  const clock = () => { if (!state.startedAt) return ""; const s = Math.max(0, Math.floor(((state.finishedAt || Date.now()) - state.startedAt) / 1000)); return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); };
  const startTimer = () => { if (!state.startedAt) { state.startedAt = Date.now(); } };

  // ---- what counts as answered, skipped, flagged ----
  const itemAnswered = (id) => Number.isInteger(state.items[id]);
  const scenAnswered = (id) => !!(state.scenarios[id] && state.scenarios[id].choice);
  const writAnswered = (id) => !!(state.writing[id] && state.writing[id].trim());
  const answered = (id) => id[0] === "B" ? itemAnswered(id) : id[0] === "S" ? scenAnswered(id) : writAnswered(id);
  const touched = (id) => id[0] === "B" ? state.items[id] !== undefined : answered(id);
  const allIds = () => ITEM_IDS.concat(SCEN_IDS, WRIT_IDS);
  // what a person sees instead of an internal ID (the workbench keeps the IDs the team works with)
  const human = (id) => id[0] === "B" ? "Statement " + (ITEM_IDS.indexOf(id) + 1) : id[0] === "S" ? "Situation " + (SCEN_IDS.indexOf(id) + 1) : "Message " + (WRIT_IDS.indexOf(id) + 1);
  const ofTotal = (id) => id[0] === "S" ? "Situation " + (SCEN_IDS.indexOf(id) + 1) + " of " + SCEN_IDS.length : "Message " + (WRIT_IDS.indexOf(id) + 1) + " of " + WRIT_IDS.length;
  const countText = (n, limit) => n + " words \u00b7 about " + limit;
  const skippedIds = () => allIds().filter((id) => !answered(id));
  function flags() {
    const out = [];
    for (const id of SCEN_IDS) {
      const a = state.scenarios[id] || {};
      if (!a.choice && (a.explanation || "").trim()) out.push(human(id) + ": a reason without a choice, so it counts as skipped");
      if (a.choice && !(a.explanation || "").trim()) out.push(human(id) + ": a choice without a reason (that is fine)");
      if (a.choice && scenWords(id) > KIT.scenario_word_limit) out.push(human(id) + ": " + scenWords(id) + " words, a little over the " + KIT.scenario_word_limit + "-word guide (kept as written)");
    }
    for (const id of WRIT_IDS) {
      if (writAnswered(id) && words(state.writing[id]) > KIT.writing_word_limit) out.push(human(id) + ": " + words(state.writing[id]) + " words, a little over the " + KIT.writing_word_limit + "-word guide (kept as written)");
    }
    return out;
  }

  // a gentle estimate of what is left: statements are quick, situations and messages take a minute or so
  function minutesLeft() {
    let s = 0;
    for (const id of ITEM_IDS) if (!touched(id)) s += 9;
    for (const id of SCEN_IDS) if (!touched(id)) s += 80;
    for (const id of WRIT_IDS) if (!touched(id)) s += 75;
    return Math.ceil(s / 60);
  }

  // ---- the answer files ----
  function answerFile(isTest) {
    const keep = (id) => TEST.has(id) === isTest;
    const file = { person_id: state.code, items: [], scenarios: [], writing: [], skipped: [] };
    if (!isTest) for (const id of ITEM_IDS) if (itemAnswered(id)) file.items.push({ id, response: state.items[id] });
    for (const id of SCEN_IDS.filter(keep)) if (scenAnswered(id)) file.scenarios.push({ id, choice: state.scenarios[id].choice, explanation: (state.scenarios[id].explanation || "").trim() });
    for (const id of WRIT_IDS.filter(keep)) if (writAnswered(id)) file.writing.push({ id, text: state.writing[id].replace(/\s+$/, "") });
    file.skipped = skippedIds().filter(keep);
    file.kit_minutes = minutes();
    file.completed_at = new Date(state.finishedAt || Date.now()).toISOString();
    return file;
  }
  let urls = [];
  const dropUrls = () => { urls.forEach((url) => URL.revokeObjectURL(url)); urls = []; };

  // ---- screens ----
  const heldOut = () => "";  // the build/test split is done by the files, never explained on the participant's screen
  const tagFor = () => "";

  // the AI-processing choice (workbench only): needed to send to the team hub
  const aiChoice = (where) => `<div class="choice">
        <span class="choice-head">2. AI processing of my answers <span class="chip">needed only to send to the team hub</span></span>
        <label class="check"><input type="checkbox" id="${where === "done" ? "agreeAiDone" : "agreeAi"}" data-ai="1" ${state.aiConsented ? "checked" : ""}> <span><b>Yes, I agree to have my answers processed by the AI services identified above for this activity.</b></span></label>
        <p class="small">I understand which AI services will receive my information, why they need it, and the applicable data-handling and retention limitations. When you send your answers to the team hub, the team's evaluation runs it through Claude Opus 5.5, OpenAI GPT Sol 6.1 and an Anthropic judge model. Without this you can still take the assessment and open your file. You may decline without penalty.</p>
      </div>`;

  // Mark's consent copy (docs/consent-copy.md). The workbench shows the /kit text as shipped; the product drops only
  // the clauses about the team hub and its held-out evaluation, which do not exist outside the workbench.
  function screenConsent() {
    const used = WB
      ? `<li><b>AI services used:</b> building your profile uses no AI service, and no AI runs on this page. If you send your answers to the team hub, the team's evaluation runs use Claude Opus 5.5 (Anthropic) and OpenAI GPT Sol 6.1, and an Anthropic judge model scores the results. In Your file, the optional <i>Rehearse with your understudy</i> sends your file to Anthropic (Claude Opus 5.5). The optional voice interview uses ElevenLabs; it is switched off today.</li>
          <li><b>Who can access your information:</b> only you, through this browser, until you download your files or send them to the team hub. Your progress is saved on our server under a private cookie so you do not lose it; the team does not browse saved progress. In the team hub, the three team members who hold the team code can see the kits and evaluation results sent there.</li>
          <li><b>Where your information is stored:</b> as you go, as your saved progress on the microverse.cloud server (nothing is kept in this browser); on that server, behind the team code, once you send your answers to the team hub, with the team's evaluation results; and at the AI providers above, for the requests sent to them, under each provider's own retention terms.</li>
          <li><b>How long information is kept:</b> saved progress until you finish, close the browser, or leave it for an hour; answers sent to the team until the team deletes them. The team plans to delete participants' answers and evaluation results after judging. <i>Start over</i> deletes your saved progress at any time.</li>
          <li><b>How to withdraw:</b> stop at any time and press <i>Start over</i>. If you already sent your answers, ask the team to delete them from the team hub; in Your file, <i>Withdraw consent</i> records your withdrawal. A file you already downloaded, or pasted into an AI model, cannot be recalled after you withdraw; withdrawal stops further processing here.</li>`
      : `<li><b>AI services used:</b> building your profile uses no AI service, and no AI runs on this page. In Your file, the optional <i>Rehearse with your understudy</i> sends your file to Anthropic (Claude Opus 5.5). The optional voice interview uses ElevenLabs; it is switched off today.</li>
          <li><b>Who can access your information:</b> only you. Your progress is saved on our server under a private cookie, so a closed tab loses nothing. The operator can technically reach it but does not browse it. Nobody else sees it unless you share.</li>
          <li><b>Where your information is stored:</b> on our server as your saved progress (nothing in this browser), and at the AI providers above for requests sent to them, under their own retention terms.</li>
          <li><b>How long information is kept:</b> saved progress is deleted when you finish, close the browser, or leave it for an hour. <i>Start over</i>, or <i>Forget this device</i> in Your file, deletes it at any time.</li>
          <li><b>How to withdraw:</b> stop at any time and press <i>Start over</i>. In Your file, <i>Withdraw consent</i> records your withdrawal and stops further processing here. A file you downloaded or pasted into an AI cannot be recalled.</li>`;
    return `<section aria-labelledby="h">
      <div class="intro">
        <span class="eyebrow">Take the assessment · about 20 to 30 minutes</span>
        <h1 id="h" tabindex="-1">Create your personal workplace profile</h1>
        <div class="reassure"><span class="chip">There are no right answers</span><span class="chip">Skip anything</span><span class="chip">You decide who sees it</span></div>
      </div>
      <div class="copy">
        <h2>About this activity</h2>
        <p>This optional activity builds a description of how you work: your preferences, how you communicate and how you might handle situations. Fixed rules build it from your answers; no AI service writes it.${WB ? " Then the team checks how well an AI using it predicts your answers to five questions kept aside." : ""}</p>
        <p>You will answer up to <b>60 questions</b>, in about <b>20 to 30 minutes</b>.</p>
        <p>You can read, question and correct the profile. It is for self-reflection, workplace communication and coaching.</p>
        <h2>Important things to know</h2>
        <ul>
          <li><b>Participation is your choice.</b> You may skip questions or decline without penalty. A manager's invitation does not make it required.</li>
          <li><b>Your profile may not be accurate.</b> Fixed rules can misread answers or miss parts of your experience, background or style. An AI answering as you from the profile can get it wrong too.</li>
          <li><b>Your profile does not speak for you.</b> It is an automated interpretation of your answers (labelled an AI-generated representation, because AI tools may answer from it), not a diagnosis, an employment assessment, or a statement you made or endorsed.</li>
          <li><b>Your profile is not for employment decisions.</b> It must not be used for hiring, promotion, discipline or ranking.</li>
          <li><b>You control whether to share your profile.</b> You review it before deciding whether to share any version.</li>
        </ul>
        <h2>How your information will be used</h2>
        <p>Your answers are used to build your profile. Please read this before you decide:</p>
        <ul>${used}</ul>
        <h2>After you complete the questionnaire</h2>
        <p>Before you share anything, you can:</p>
        <ol>
          <li><b>Review</b> what it says and which answers support each point.</li>
          <li><b>Question or correct</b> anything that seems wrong.</li>
          <li><b>Choose whether to share</b>, which version, and with whom.</li>
        </ol>
      </div>
      <div class="choices">
        <h2>Your choices</h2>
        <div class="choice">
          <span class="choice-head">1. Participation <span class="chip accent">required</span></span>
          <label class="check"><input type="checkbox" id="agree" ${state.consented ? "checked" : ""}> <span><b>Yes, I voluntarily agree to complete the questionnaire and create a personal workplace profile.</b></span></label>
          <p class="small">I understand the purpose of the activity, that participation is optional, and that the resulting profile may not fully or accurately reflect who I am.</p>
        </div>
        ${WB ? aiChoice("consent") : ""}
        <p class="small">${WB ? "Only the first choice is needed to take the assessment. You may decline either one without penalty, and declining is not a personality characteristic." : "You may decline without penalty, and declining is not a personality characteristic."}</p>
      </div>
      ${flash ? `<p class="err" role="alert">${esc(flash)}</p>` : ""}
      <div class="row"><button class="btn ghost" type="button" id="decline">No thanks</button></div>
      ${state.code ? footline() : ""}
    </section>`;
  }

  function screenCode() {
    return `<section aria-labelledby="h">
      <div class="intro">
        <span class="eyebrow">Before you start</span>
        <h1 id="h" tabindex="-1">Choose a code instead of your name</h1>
        <p class="lead">A few tips first. You can change any answer later.</p>
      </div>
      <div class="panel"><ul class="tips">
        <li>Finish in one sitting: nothing is kept if you close the browser or leave for an hour, so complete the assessment or press Start over. Answer on your own, without AI help or coaching. Describe yourself as you generally are now, not as you wish to be.</li>
        <li>Compare yourself with people you know of roughly your age.</li>
        <li>In the scenarios, choose what you would actually do.</li>
        <li>Write messages in your usual style rather than trying to sound ideal.</li>
        <li>Use a code, not your name. Leave real employers, clients, colleagues and other identifying details out of your written answers.</li>
      </ul></div>
      <div class="field">
        <label for="code">Person code</label>
        <span class="help" id="codehelp">2 to 32 letters, digits, - or _. Anything you will recognise, like SAM-07. No real name.</span>
        <input type="text" id="code" autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="32" value="${esc(state.code)}" aria-describedby="codehelp codeerr"${flash ? ' aria-invalid="true"' : ""}>
        <span class="err" id="codeerr" role="alert">${esc(flash)}</span>
      </div>
      ${footline()}
    </section>`;
  }

  function screenItems(page) {
    const ids = ITEM_IDS.slice(page * PAGE, page * PAGE + PAGE);
    const rows = ids.map((id) => {
      const v = state.items[id];
      const opts = [1, 2, 3, 4, 5].map((n) => `<label title="${esc(KIT.response_labels[n])}"><input type="radio" name="${id}" value="${n}" ${v === n ? "checked" : ""}><span aria-hidden="true">${n}</span><span class="sr">${esc(KIT.response_labels[n])}</span></label>`).join("");
      return `<fieldset class="item" id="q-${id}"><legend><span class="q"><span>I ${esc(KIT.items[id].charAt(0).toLowerCase() + KIT.items[id].slice(1))}</span></span></legend>
        <div class="seg">${opts}<label class="skip"><input type="radio" name="${id}" value="skip" ${v === "skip" ? "checked" : ""}><span>Skip</span></label></div></fieldset>`;
    }).join("");
    return `<section aria-labelledby="h">
      <div class="intro">
        <span class="eyebrow">About you · ${page * PAGE + 1} to ${page * PAGE + ids.length} of ${ITEM_IDS.length}</span>
        <h1 id="h" tabindex="-1">How well does each one describe you?</h1>
        <p class="lead">Go with your first instinct. There are no right answers, and you can skip any statement.</p>
      </div>
      <div class="scalekey" aria-hidden="true"><span>1 · ${esc(cap(KIT.response_labels[1]))}</span><span>${esc(cap(KIT.response_labels[5]))} · 5</span></div>
      ${rows}
      ${footline()}
    </section>`;
  }

  function screenScenarios() {
    const blocks = SCEN_IDS.map((id) => {
      const s = KIT.scenarios[id], a = state.scenarios[id] || {};
      const opts = Object.entries(s.options).map(([L, text]) => `<label class="opt"><input type="radio" name="${id}" value="${L}" ${a.choice === L ? "checked" : ""}><span class="L">${L}</span><span>${esc(text)}</span></label>`).join("");
      const n = scenWords(id);
      return `<fieldset class="scen" id="q-${id}"><legend class="sr">${ofTotal(id)}: ${esc(s.wording)}</legend>
        <div class="head"><span class="chip">${ofTotal(id)}</span>${tagFor(id)}</div>
        <p class="wording" aria-hidden="true">${esc(s.wording)}</p>
        <div class="opts">${opts}</div>
        <div class="field"><div class="between"><label for="x-${id}">Why this one? A sentence is plenty.</label>
          <span class="count ${n > KIT.scenario_word_limit ? "over" : ""}" id="c-${id}" aria-live="polite">${countText(n, KIT.scenario_word_limit)}</span></div>
          <textarea id="x-${id}" data-scen="${id}" rows="2" aria-describedby="c-${id}">${esc(a.explanation || "")}</textarea></div>
      </fieldset>`;
    }).join("");
    return `<section aria-labelledby="h">
      <div class="intro">
        <span class="eyebrow">Workplace situations · 6</span>
        <h1 id="h" tabindex="-1">What would you actually do?</h1>
        <p class="lead">Pick what you would most likely do, or the closest option, then say why in a sentence. There's no right answer.</p>
      </div>
      ${heldOut()}
      ${blocks}
      ${footline()}
    </section>`;
  }

  function screenWriting() {
    const blocks = WRIT_IDS.map((id) => {
      const t = state.writing[id] || "", n = words(t);
      return `<div class="scen" id="q-${id}">
        <div class="head"><span class="chip">${ofTotal(id)}</span>${tagFor(id)}</div>
        <label class="wording" for="w-${id}">${esc(KIT.writing[id])}</label>
        <textarea id="w-${id}" data-writ="${id}" rows="4" aria-describedby="c-${id}">${esc(t)}</textarea>
        <span class="count ${n > KIT.writing_word_limit ? "over" : ""}" id="c-${id}" aria-live="polite">${countText(n, KIT.writing_word_limit)}</span>
      </div>`;
    }).join("");
    return `<section aria-labelledby="h">
      <div class="intro">
        <span class="eyebrow">Short messages · 4</span>
        <h1 id="h" tabindex="-1">Write it the way you usually would</h1>
        <p class="lead">A few lines is plenty. Leave out real names.</p>
      </div>
      ${heldOut()}
      ${blocks}
      ${footline()}
    </section>`;
  }

  function screenReview() {
    const skipped = skippedIds(), fl = flags();
    const chip = (id) => `<button type="button" data-goto="${id}" aria-label="Go back to ${human(id)}">${human(id)}</button>`;
    return `<section aria-labelledby="h">
      <div class="intro">
        <span class="eyebrow">Nearly there</span>
        <h1 id="h" tabindex="-1">A quick look before you finish</h1>
        <p class="lead">Skipped answers are fine. Your file simply says less about those parts.</p>
      </div>
      <div class="stat">
        <div><b>${allIds().length - skipped.length}</b><span>of ${allIds().length} answered</span></div>
        <div><b>${skipped.length}</b><span>skipped</span></div>
      </div>
      <div class="panel"><h3>Skipped</h3>
        ${skipped.length ? `<p class="small">Want to go back to one? Choose it below. Or leave them; that is fine.</p><div class="list">${skipped.map(chip).join("")}</div>` : '<p class="small">Nothing skipped.</p>'}
      </div>
      ${fl.length ? `<div class="panel"><h3>Worth a second look</h3><p class="small">These are allowed as written. Change them only if you want to.</p><ul class="flags">${fl.map((f) => `<li>${esc(f)}</li>`).join("")}</ul></div>` : ""}
      ${WB ? `<div class="choices"><h2>Submit your answers</h2><p class="small">Tick to agree, then press <b>Agree and submit</b>: your answers go to the team and your file opens for review. Leave it unticked to open your file without sending anything.</p>${aiChoice("done")}</div>` : ""}
      ${footline()}
    </section>`;
  }

  function screenDone() {
    const failed = WB && state.aiConsented && sendResult && sendResult.kind !== "ok";
    let result = "";
    if (failed) result = `<div class="result bad" role="alert"><p>${esc(sendResult.message)}</p></div>`;
    return `<section aria-labelledby="h">
      <div class="intro">
        <span class="eyebrow">All done${state.code ? " · " + esc(state.code) : ""}</span>
        <h1 id="h" tabindex="-1">${failed ? "Your answers were not sent yet" : "Thank you. Your file is ready."}</h1>
        <p class="lead">${failed ? "Your answers are saved. Try again, or open your file now." : "Open your file, check each statement and correct anything that does not sound like you."}</p>
      </div>
      <div id="sendresult">${result}</div>
      <p class="small"><a href="/interview" id="tointerview">Add your own words (optional, about 10 minutes)</a>. A short interview about real work situations. You check every answer before it is used.</p>
      <div class="row"><button class="btn ghost small" type="button" id="toreview">Change an answer</button></div>
      ${footline()}
    </section>`;
  }

  function footline() {
    const box = confirming ? `<div class="confirm" role="alertdialog" aria-labelledby="ch"><p id="ch">Start over? Every answer, your person code and your file are deleted, and the assessment starts blank. This cannot be undone.</p>
      <div class="row"><button class="btn" type="button" id="keep">Keep going</button><button class="btn danger" type="button" id="wipe">Start over</button></div></div>` : "";
    return `<div class="footline"><span class="small">Saved for this session only. Closing the browser or an hour away starts clean.</span><button class="btn ghost small danger" type="button" id="clear">Start over</button></div>${box}`;
  }

  // ---- render and navigation ----
  function render(focus) {
    const name = STEPS[state.step];
    dropUrls();
    if (name === "consent") main.innerHTML = screenConsent();
    else if (name === "code") main.innerHTML = screenCode();
    else if (name.startsWith("items")) main.innerHTML = screenItems(Number(name.slice(5)));
    else if (name === "scenarios") main.innerHTML = screenScenarios();
    else if (name === "writing") main.innerHTML = screenWriting();
    else if (name === "review") main.innerHTML = screenReview();
    else main.innerHTML = screenDone();
    main.classList.remove("spawn-in"); void main.offsetWidth; main.classList.add("spawn-in");
    const retry = WB && state.aiConsented && sendResult && sendResult.kind !== "ok";
    const labels = { consent: "Start", code: "Begin", review: WB && state.aiConsented ? "Agree and submit" : "Finish", done: retry ? "Try again" : "Open your file" };
    next.textContent = labels[name] || "Next";
    back.classList.toggle("hidden", state.step === 0 || name === "done");
    openBtn.classList.toggle("hidden", !(name === "done" && retry));
    next.disabled = name === "consent" && !state.consented;
    hint();
    renderPath();
    tick();
    if (focus) { if (typeof focus === "string") { const el = document.getElementById(focus); if (el) { el.scrollIntoView({ block: "center" }); const input = el.querySelector("input, textarea"); if (input) input.focus(); } } else { window.scrollTo(0, 0); const h = document.getElementById("h"); (h || main).focus({ preventScroll: true }); } }
  }

  // the section path in the top bar: where you are, not a menu
  const SECTIONS = [["Agree", (n) => n === "consent"], ["Code", (n) => n === "code"], ["About you", (n) => n.startsWith("items")],
    ["Situations", (n) => n === "scenarios"], ["Messages", (n) => n === "writing"], ["Review", (n) => n === "review"], ["Done", (n) => n === "done"]];
  const kitpath = document.getElementById("kitpath");
  const bar = document.getElementById("kitprogress");
  function renderPath() {
    const name = STEPS[state.step];
    const here = SECTIONS.findIndex(([, test]) => test(name));
    kitpath.innerHTML = SECTIONS.map(([label], i) => `<li><span class="st${i === here ? " on" : ""}${i < here ? " done" : ""}"${i === here ? ' aria-current="step"' : ""}><span class="n">${i + 1}</span><span class="lbl">${label}</span></span></li>`).join("");
    progress();
  }
  function progress() {
    const ids = allIds();
    const pct = STEPS[state.step] === "done" ? 100 : Math.round(ids.filter(touched).length / ids.length * 100);
    bar.setAttribute("aria-valuenow", pct); bar.firstElementChild.style.width = pct + "%";
  }
  const nexthint = document.getElementById("nexthint");
  function hint() {
    const name = STEPS[state.step];
    nexthint.textContent = name === "consent" && !state.consented ? "Tick 1, Participation, to start."
      : "";
  }
  const kittimer = document.getElementById("kittimer");
  function tick() {
    const name = STEPS[state.step];
    const left = minutesLeft();
    const label = name === "consent" ? "About 20 to 30 minutes"
      : name === "done" ? "<b>Finished</b>"
      : left <= 1 ? "<b>Almost done</b>" : `About <b>${left} minutes</b> left`;
    if (steplabel.innerHTML !== label) steplabel.innerHTML = label;
    // the running clock is for the team's records: shown only in the workbench
    kittimer.textContent = WB && clock() && name !== "consent" ? clock() : "";
  }
  setInterval(() => { if (WB && state.startedAt && !state.finishedAt) tick(); }, 1000);

  function go(step, focus) { state.step = Math.max(0, Math.min(STEPS.length - 1, step)); flash = ""; confirming = false; save(); render(focus || true); }

  // the agreement given on the first screen, recorded with the server (the consent ledger) and handed to Your file,
  // so it opens straight on the review. An agreement Your file already holds for this code is kept as it is.
  async function recordConsent() {
    const held = (() => { try { return JSON.parse(CTX.sessionStorage.getItem(CONSENT) || "null"); } catch (_) { return null; } })();
    if (held && held.token && held.pid === state.code) return;
    const team = WB && state.aiConsented && state.sent;
    const purposes = ["build_profile"].concat(team ? ["team_evaluation"] : []);
    try {
      const r = await fetch("/api/consent", { method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ person_id: state.code, purposes, share_with: team ? ["team hub"] : [],
          ai_services: team ? ["Claude Opus 5.5 and OpenAI GPT Sol 6.1 (team evaluation), an Anthropic judge model"] : [] }) });
      const body = r.ok ? await r.json() : {};
      if (body.consent_token) CTX.sessionStorage.setItem(CONSENT, JSON.stringify({ pid: state.code, token: body.consent_token, purposes, at: (body.receipt && body.receipt.at) || new Date().toISOString() }));
    } catch (_) { /* Your file asks for the agreement again */ }
  }

  // hand the build answers to Your file and open it on the review
  async function openFile(to) {
    if (!state.finishedAt) { startTimer(); state.finishedAt = Date.now(); }
    next.disabled = true; next.setAttribute("aria-busy", "true"); next.textContent = "Opening your file...";
    await recordConsent();
    const handoff = JSON.stringify({ answers: answerFile(false), person_id: state.code, from: "assessment", at: new Date().toISOString() });
    try { CTX.sessionStorage.setItem(HANDOFF, handoff); } catch (_) {}
    try {
      if (state.remember) { CTX.localStorage.setItem(HANDOFF, handoff); CTX.localStorage.setItem(REMEMBER, "1"); save(); }
      else { CTX.localStorage.removeItem(HANDOFF); CTX.localStorage.removeItem(REMEMBER); CTX.localStorage.removeItem(STORE); }
    } catch (_) {}
    try { await Promise.race([CTX.flush(), new Promise((r) => setTimeout(r, 4000))]); } catch (_) {}
    location.href = typeof to === "string" ? to : "/app#file";
  }

  async function send() {
    try {
      const response = await fetch("/api/kit/submit", { method: "POST", credentials: "same-origin", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ code: state.code, build: answerFile(false), test: answerFile(true) }) });
      let body = {}; try { body = await response.json(); } catch (_) {}
      if (response.ok) { sendResult = { kind: "ok", problems: Array.isArray(body.problems) ? body.problems : [] }; state.sent = new Date().toISOString(); save(); }
      else sendResult = { kind: "error", message: "Your answers could not be sent: " + (body.error || "status " + response.status) + "." };
    } catch (_) {
      sendResult = { kind: "error", message: "The server did not answer. Check your connection and try again." };
    }
  }

  // Finish: with the workbench and AI consent, both answer files go to the team hub; then straight to the review.
  // Only a failed send stops on the done screen, with Try again and Open your file anyway.
  async function finish() {
    if (!state.finishedAt) { startTimer(); state.finishedAt = Date.now(); }
    if (WB && state.aiConsented) {
      next.disabled = true; next.setAttribute("aria-busy", "true"); next.textContent = "Saving your answers...";
      await send();
      next.disabled = false; next.removeAttribute("aria-busy");
      if (!sendResult || sendResult.kind !== "ok") return go(STEPS.indexOf("done"));
    }
    return openFile();
  }

  next.addEventListener("click", () => {
    const name = STEPS[state.step];
    if (name === "consent") { if (!state.consented) { flash = "Tick 1, Participation, to agree, or choose No thanks."; return render(false); } return go(state.step + 1); }
    if (name === "code") {
      const code = (document.getElementById("code").value || "").trim();
      if (!CODE_RE.test(code)) { flash = "Use 2 to 32 letters, digits, - or _, with no spaces. A made-up code is perfect."; render(false); document.getElementById("code").focus(); return; }
      state.code = code; return go(state.step + 1);
    }
    if (name === "review" || name === "done") { sendResult = null; return finish(); }
    go(state.step + 1);
  });
  back.addEventListener("click", () => go(state.step - 1));
  openBtn.addEventListener("click", () => openFile());

  main.addEventListener("change", (event) => {
    const t = event.target;
    if (t.id === "agree") { state.consented = t.checked; flash = ""; next.disabled = !t.checked; hint(); save(); return; }
    if (t.id === "rememberDevice") { state.remember = t.checked; save(); return; }
    if (t.dataset.ai) { state.aiConsented = t.checked; if (STEPS[state.step] === "review") next.textContent = WB && t.checked ? "Agree and submit" : "Finish"; hint(); save(); return; }
    if (t.type !== "radio") return;
    if (/^B\d\d$/.test(t.name)) { startTimer(); state.items[t.name] = t.value === "skip" ? "skip" : Number(t.value); }
    else if (/^S\d\d$/.test(t.name)) { startTimer(); state.scenarios[t.name] = Object.assign({}, state.scenarios[t.name], { choice: t.value }); updateCount(t.name); }
    save(); tick(); progress();
  });

  function updateCount(id) {
    const el = document.getElementById("c-" + id); if (!el) return;
    const n = id[0] === "S" ? scenWords(id) : words(state.writing[id]);
    const limit = id[0] === "S" ? KIT.scenario_word_limit : KIT.writing_word_limit;
    el.textContent = countText(n, limit); el.classList.toggle("over", n > limit);
  }

  main.addEventListener("input", (event) => {
    const t = event.target;
    if (t.dataset.scen) { startTimer(); state.scenarios[t.dataset.scen] = Object.assign({}, state.scenarios[t.dataset.scen], { explanation: t.value }); updateCount(t.dataset.scen); }
    else if (t.dataset.writ) { startTimer(); state.writing[t.dataset.writ] = t.value; updateCount(t.dataset.writ); }
    else if (t.id === "code") { flash = ""; const e = document.getElementById("codeerr"); if (e) e.textContent = ""; t.removeAttribute("aria-invalid"); return; }
    else return;
    save(); tick(); progress();
  });

  main.addEventListener("click", (event) => {
    // the optional interview: hand the answers over first, so Your file has them when the person arrives from /interview
    if (event.target.closest("#tointerview")) { event.preventDefault(); return openFile("/interview"); }
    const t = event.target.closest("button"); if (!t) return;
    if (t.id === "decline") { state = blank(); save(); main.innerHTML = `<section aria-labelledby="h"><div class="intro"><span class="eyebrow">No thanks</span><h1 id="h" tabindex="-1">That's fine.</h1><p class="lead">Nothing was saved, and declining says nothing about you. You can close this page. If you change your mind, <a href="/assessment">start again</a> any time.</p></div><div class="row"><a class="btn" href="/">Back to home</a></div></section>`; back.classList.add("hidden"); next.disabled = true; steplabel.textContent = ""; kittimer.textContent = ""; kitpath.innerHTML = ""; nexthint.textContent = ""; document.getElementById("actionbar").classList.add("hidden"); document.getElementById("h").focus(); return; }
    if (t.id === "clear") { confirming = true; render(false); const k = document.getElementById("keep"); if (k) k.focus(); return; }
    if (t.id === "keep") { confirming = false; render(false); return; }
    // Start over: everything saved for this browser goes (answers, person code, the file handed to Your file, consent),
    // and a fresh saved-progress cookie starts with a blank assessment, so the next person begins clean
    if (t.id === "wipe") { t.disabled = true; CTX.forgetAll().finally(() => location.replace("/assessment")); return; }
    if (t.id === "toreview") return go(STEPS.indexOf("review"));
    if (t.dataset.goto) {
      const id = t.dataset.goto;
      const step = id[0] === "B" ? STEPS.indexOf("items" + Math.floor(ITEM_IDS.indexOf(id) / PAGE)) : STEPS.indexOf(id[0] === "S" ? "scenarios" : "writing");
      return go(step, "q-" + id);
    }
  });

  if (state.step >= STEPS.length) state.step = 0;
  if (STEPS[state.step] === "done" && !state.finishedAt) state.step = STEPS.indexOf("review");
  render(false);
  // the workbench's extras appear only when the server runs it; missing or failing config means the product
  fetch("/api/config").then((r) => r.ok ? r.json() : {}).then((config) => {
    if (config && config.workbench_enabled === true) { WB = true; const done = STEPS[state.step]; if (["consent", "scenarios", "writing", "done"].includes(done)) render(false); else { hint(); tick(); } }
  }).catch(() => {});
})();
</script>
</body>
</html>

<!-- kit - take the Common Kit: consent, person code, 50 items, 6 scenarios, 4 writing samples, timed; out come build.json and test.json -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>lumin8r kit</title>
<meta name="description" content="Take the Common Kit for your team: 60 prompts, about 20 to 30 minutes. Your answers stay in this browser until you download or send them.">
<link rel="stylesheet" href="/static/mefile.css">
<style>
  .kit { max-width: 760px; margin: 0 auto; padding: var(--s-6) 16px 140px; display: grid; gap: var(--s-5); grid-template-columns: minmax(0, 1fr); }
  .kit > section { display: grid; gap: var(--s-4); grid-template-columns: minmax(0, 1fr); }
  .kit > section > h1 { margin-top: calc(var(--s-2) * -1); }
  .kit h1 { font-size: clamp(28px, 7vw, 40px); letter-spacing: -0.04em; }
  .kit h1 em { font-style: normal; color: var(--accent); }
  .steplabel { font: 400 11px/1 var(--pixel); color: var(--muted); text-transform: lowercase; }
  .steplabel b { color: var(--accent); font-weight: 400; }
  .timer { font: 600 12px/1 var(--mono); color: var(--ink-2); font-variant-numeric: tabular-nums; min-width: 4ch; text-align: right; }
  .timer:empty { display: none; }
  @media (max-width: 520px) { .stations.compact .st:not(.on) .lbl { display: none; } }
  .terms { display: grid; gap: 8px; margin: 0; padding: 0; list-style: none; }
  .terms li { color: var(--ink-2); font-size: 15px; padding-left: 16px; position: relative; }
  .terms li::before { content: ""; position: absolute; left: 0; top: .6em; width: 6px; height: 6px; background: var(--accent); }
  .terms b { color: var(--ink); }
  .heldout { border: 1px solid var(--caution); background: rgba(255, 181, 71, .08); border-radius: var(--radius); padding: 14px 16px; display: grid; gap: 6px; }
  .heldout .tag { font: 400 11px/1 var(--pixel); color: var(--caution); text-transform: lowercase; }
  .heldout p { color: var(--ink); font-size: 16px; line-height: 1.45; }
  .field { display: grid; gap: 6px; }
  .field input { width: 100%; max-width: 320px; font-family: var(--mono); font-size: 16px; }
  .field > label { font-weight: 600; color: var(--ink); }
  .err { color: var(--bad); font-size: 14px; }
  .err:empty { display: none; }
  .key { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13px; color: var(--muted); }
  .key b { font: 600 12px/1 var(--mono); color: var(--accent); margin-right: 4px; }
  fieldset { border: 0; margin: 0; padding: 0; min-width: 0; }
  .item { display: grid; gap: var(--s-3); padding: var(--s-4); background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius-sm); scroll-margin-top: 80px; }
  .item legend { display: contents; }
  .item .q { display: flex; gap: 10px; align-items: baseline; color: var(--ink); font-size: 16px; line-height: 1.4; }
  .id { font: 600 11px/1.4 var(--mono); color: var(--faint); flex: none; }
  .seg { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)) minmax(0, 1.2fr); gap: 6px; }
  .seg label { position: relative; display: grid; place-items: center; height: 40px; border: 1px solid var(--line); border-radius: var(--radius-sm); background: var(--well); cursor: pointer; font: 600 15px/1 var(--mono); color: var(--ink-2); }
  .seg label.skip { font: 400 11px/1 var(--pixel); text-transform: lowercase; color: var(--muted); }
  .seg input { position: absolute; opacity: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; }
  .seg label:hover { border-color: var(--line-2); }
  .seg label:has(input:focus-visible) { outline: 2px solid var(--accent); outline-offset: 2px; }
  .seg label:has(input:checked) { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .seg label.skip:has(input:checked) { background: var(--panel-2); border-color: var(--line-2); color: var(--ink); }
  .sr { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .scen { display: grid; gap: var(--s-3); padding: var(--s-4); background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); scroll-margin-top: 80px; }
  .scen .head { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .scen .wording { color: var(--ink); font-size: 16px; line-height: 1.45; }
  .opts { display: grid; gap: 6px; }
  .opt { display: grid; grid-template-columns: 22px 18px 1fr; gap: 8px; align-items: start; padding: 8px 10px; border: 1px solid var(--line); border-radius: var(--radius-sm); background: var(--well); cursor: pointer; color: var(--ink-2); }
  .opt input { margin: 3px 0 0; accent-color: var(--accent); width: 16px; height: 16px; }
  .opt .L { font: 600 13px/1.5 var(--mono); color: var(--accent); }
  .opt:has(input:checked) { border-color: rgba(198, 244, 50, .55); background: var(--accent-soft); color: var(--ink); }
  .chip { display: inline-block; font: 400 10px/1 var(--pixel); text-transform: lowercase; padding: 5px 7px; border-radius: 99px; border: 1px solid var(--line-2); color: var(--muted); }
  .chip.test { border-color: var(--caution); color: var(--caution); }
  .count { font: 600 12px/1 var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; }
  .count.over { color: var(--caution); }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .between { display: flex; gap: 8px; flex-wrap: wrap; align-items: baseline; justify-content: space-between; }
  .list { display: flex; flex-wrap: wrap; gap: 6px; }
  .list button { font: 600 12px/1 var(--mono); color: var(--ink-2); background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; cursor: pointer; }
  .list button:hover { border-color: var(--line-2); color: var(--ink); }
  .flags { margin: 0; padding-left: 18px; display: grid; gap: 4px; color: var(--ink-2); font-size: 14px; }
  .stat { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 8px; }
  .stat div { background: var(--panel-2); border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 10px 12px; display: grid; gap: 4px; }
  .stat b { font: 700 22px/1 var(--display); color: var(--ink); }
  .stat span { font: 400 11px/1.3 var(--pixel); color: var(--muted); text-transform: lowercase; }
  .result { border-radius: var(--radius-sm); padding: var(--s-3) var(--s-4); font-size: 14px; line-height: 1.5; }
  .result > * + * { margin-top: var(--s-2); }
  .result b { display: block; }
  .result.ok { border: 1px solid rgba(198, 244, 50, .45); background: var(--accent-soft); color: var(--ink); }
  .result.warn { border: 1px solid var(--caution); background: rgba(255, 181, 71, .08); color: var(--ink); }
  .result.bad { border: 1px solid var(--bad); background: var(--bad-soft); color: var(--ink); }
  .confirm { border: 1px solid var(--bad); background: var(--bad-soft); border-radius: var(--radius-sm); padding: 12px; display: grid; gap: 10px; }
  .footline { border-top: 1px solid var(--line); padding-top: var(--s-4); margin-top: var(--s-3); display: flex; gap: 10px; flex-wrap: wrap; align-items: center; justify-content: space-between; }
  .actionbar .btn.big { min-width: 0; }
  @media (max-width: 480px) {
    .kit { padding-top: 20px; }
    .seg { grid-template-columns: repeat(5, minmax(0, 1fr)); }
    .seg label.skip { grid-column: 1 / -1; height: 32px; }
    .actionbar .btn.big { flex: 1 1 0; }
  }
</style>
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>
<header class="topbar">
  <div class="topbar-row">
    <a class="wordmark" href="/" aria-label="lumin8r home">
      <svg class="mark" viewBox="0 0 32 32" aria-hidden="true">
        <path d="M3 10V3h7M22 3h7v7M29 22v7h-7M10 29H3v-7" fill="none" stroke="#97a3c2" stroke-width="2"/>
        <rect x="13" y="7" width="6" height="6" fill="#c6f432"/>
        <rect x="11" y="14" width="10" height="8" fill="#c6f432"/>
        <rect x="11" y="22" width="3" height="3" fill="#c6f432"/>
        <rect x="18" y="22" width="3" height="3" fill="#c6f432"/>
        <rect x="22" y="12" width="3" height="3" fill="#5b7fff"/>
      </svg>
      <b>lumin8r</b>
    </a>
    <nav class="sitenav" aria-label="Site">
      <a href="/kit" aria-current="page"><span class="long">Take the kit</span><span class="short">Kit</span></a>
      <a href="/app"><span class="long">Your file</span><span class="short">File</span></a>
      <span class="sep" aria-hidden="true"></span>
      <a href="/team"><span class="long">Team hub</span><span class="short">Team</span></a>
    </nav>
  </div>
  <div class="pathbar">
    <ol class="stations compact" id="kitpath" aria-label="Kit sections"></ol>
    <div class="pathend"><span class="steplabel" id="steplabel" aria-live="polite"></span><span class="timer" id="kittimer" role="timer" aria-label="time since your first answer"></span></div>
  </div>
</header>

<main class="kit" id="main" tabindex="-1"></main>

<div class="actionbar" id="actionbar" role="group" aria-label="Move through the kit">
  <span class="hint" id="nexthint" aria-live="polite"></span>
  <button class="btn big" id="back" type="button">Back</button>
  <button class="btn lime big" id="next" type="button">Next</button>
</div>

<script id="kit-data" type="application/json">__KIT_DATA__</script>
<script>
(() => {
  "use strict";
  const KIT = JSON.parse(document.getElementById("kit-data").textContent);
  const ITEM_IDS = Object.keys(KIT.items).sort();
  const SCEN_IDS = Object.keys(KIT.scenarios).sort();
  const WRIT_IDS = Object.keys(KIT.writing).sort();
  const TEST = new Set(KIT.test_ids);
  const PAGE = 10;
  const ITEM_PAGES = Math.ceil(ITEM_IDS.length / PAGE);
  const CODE_RE = /^[A-Za-z0-9_-]{2,32}$/;
  const STORE = "lumin8r-kit-v1";
  const STEPS = ["consent", "code"].concat(Array.from({ length: ITEM_PAGES }, (_, i) => "items" + i), ["scenarios", "writing", "review", "done"]);

  const blank = () => ({ step: 0, consented: false, code: "", items: {}, scenarios: {}, writing: {}, startedAt: null, finishedAt: null, sent: null });
  let state = blank();
  try { const saved = JSON.parse(localStorage.getItem(STORE) || "null"); if (saved && typeof saved === "object") state = Object.assign(blank(), saved); } catch (_) {}
  const save = () => { try { localStorage.setItem(STORE, JSON.stringify(state)); } catch (_) {} };

  const main = document.getElementById("main");
  const back = document.getElementById("back");
  const next = document.getElementById("next");
  const steplabel = document.getElementById("steplabel");
  let flash = "";
  let confirming = false;
  let sendResult = null;

  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const words = (s) => String(s || "").trim().split(/\s+/).filter(Boolean).length;
  const scenWords = (id) => { const a = state.scenarios[id] || {}; return words(a.explanation) + (a.choice ? 1 : 0); };
  const minutes = () => state.startedAt ? Math.round(((state.finishedAt || Date.now()) - state.startedAt) / 6000) / 10 : 0;
  const clock = () => { if (!state.startedAt) return ""; const s = Math.max(0, Math.floor(((state.finishedAt || Date.now()) - state.startedAt) / 1000)); return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); };
  const startTimer = () => { if (!state.startedAt) { state.startedAt = Date.now(); } };

  // ---- what counts as answered, skipped, flagged ----
  const itemAnswered = (id) => Number.isInteger(state.items[id]);
  const scenAnswered = (id) => !!(state.scenarios[id] && state.scenarios[id].choice);
  const writAnswered = (id) => !!(state.writing[id] && state.writing[id].trim());
  const answered = (id) => id[0] === "B" ? itemAnswered(id) : id[0] === "S" ? scenAnswered(id) : writAnswered(id);
  const allIds = () => ITEM_IDS.concat(SCEN_IDS, WRIT_IDS);
  const skippedIds = () => allIds().filter((id) => !answered(id));
  function flags() {
    const out = [];
    for (const id of SCEN_IDS) {
      const a = state.scenarios[id] || {};
      if (!a.choice && (a.explanation || "").trim()) out.push(id + ": explanation without a choice; counted as skipped");
      if (a.choice && !(a.explanation || "").trim()) out.push(id + ": choice without a sentence explaining it");
      if (a.choice && scenWords(id) > KIT.scenario_word_limit) out.push(id + ": " + scenWords(id) + " words, over the " + KIT.scenario_word_limit + "-word limit (kept as written)");
    }
    for (const id of WRIT_IDS) {
      if (writAnswered(id) && words(state.writing[id]) > KIT.writing_word_limit) out.push(id + ": " + words(state.writing[id]) + " words, over the " + KIT.writing_word_limit + "-word limit (kept as written)");
    }
    return out;
  }

  // ---- the two organizer files ----
  function answerFile(isTest) {
    const keep = (id) => TEST.has(id) === isTest;
    const file = { person_id: state.code, items: [], scenarios: [], writing: [], skipped: [] };
    if (!isTest) for (const id of ITEM_IDS) if (itemAnswered(id)) file.items.push({ id, response: state.items[id] });
    for (const id of SCEN_IDS.filter(keep)) if (scenAnswered(id)) file.scenarios.push({ id, choice: state.scenarios[id].choice, explanation: (state.scenarios[id].explanation || "").trim() });
    for (const id of WRIT_IDS.filter(keep)) if (writAnswered(id)) file.writing.push({ id, text: state.writing[id].replace(/\s+$/, "") });
    file.skipped = skippedIds().filter(keep);
    file.kit_minutes = minutes();
    file.completed_at = new Date(state.finishedAt || Date.now()).toISOString();
    return file;
  }
  let urls = [];
  const fileUrl = (isTest) => { const url = URL.createObjectURL(new Blob([JSON.stringify(answerFile(isTest), null, 2) + "\n"], { type: "application/json" })); urls.push(url); return url; };
  const dropUrls = () => { urls.forEach((url) => URL.revokeObjectURL(url)); urls = []; };

  // ---- screens ----
  const heldOut = () => `<div class="heldout" role="note"><span class="tag">held out</span>
    <p>Your answers to S02, S04, S06, W02 and W04 are the test answers. They are held out: never paste them into a model or the converter. They go only in test.json.</p></div>`;

  function screenConsent() {
    return `<section aria-labelledby="h">
      <span class="eyebrow">common kit · 60 prompts · about 20 to 30 minutes</span>
      <h1 id="h">Take the kit <em>for your team.</em></h1>
      <p class="lead">Your answers help your team create and evaluate a personality profile. Read this first. Nothing starts until you agree.</p>
      <div class="panel"><ul class="terms">
        <li><b>Purpose:</b> your team builds a converter that turns kit answers into a profile, then checks how well an AI using that profile predicts your answers to held-out questions. It is for the challenge, not for hiring, promotion, discipline or ranking.</li>
        <li><b>Who sees your answers:</b> only this browser, until you download the files or send them to your team hub. The team then sees them in the hub. No AI runs on this page.</li>
        <li><b>Voluntary:</b> taking part and sharing are your choice. You can skip any question, stop at any time, or question the profile your team makes.</li>
        <li><b>A manager's request does not replace your agreement.</b></li>
        <li><b>Declining is not a personality characteristic</b> and must not be read as one.</li>
      </ul></div>
      <label class="check"><input type="checkbox" id="agree" ${state.consented ? "checked" : ""}> <span>I have read this and I agree to take the kit.</span></label>
      ${flash ? `<p class="err" role="alert">${esc(flash)}</p>` : ""}
      <div class="row"><button class="btn" type="button" id="decline">No thanks</button></div>
      ${state.code ? footline() : ""}
    </section>`;
  }

  function screenCode() {
    return `<section aria-labelledby="h">
      <span class="eyebrow">before you start</span>
      <h1 id="h">Your person code</h1>
      <div class="panel"><ul class="terms">
        <li>Describe yourself as you generally are now, not as you wish to be.</li>
        <li>Compare yourself with people you know of roughly your age.</li>
        <li>In the scenarios, choose what you would actually do.</li>
        <li>Write messages in your usual style rather than trying to sound ideal.</li>
        <li>Use a person code instead of your name. Avoid including real employers, clients, colleagues, or other identifying details in free-text answers.</li>
      </ul></div>
      <div class="field">
        <label for="code">Person code <span class="small">(2 to 32 letters, digits, - or _; no real name)</span></label>
        <input type="text" id="code" autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="32" value="${esc(state.code)}" aria-describedby="codeerr"${flash ? ' aria-invalid="true"' : ""}>
        <span class="err" id="codeerr" role="alert">${esc(flash)}</span>
      </div>
      <p class="small">The timer starts at your first answer and stops when you finish. Your team records the actual time.</p>
      ${footline()}
    </section>`;
  }

  function screenItems(page) {
    const ids = ITEM_IDS.slice(page * PAGE, page * PAGE + PAGE);
    const key = Object.entries(KIT.response_labels).map(([n, l]) => `<span><b>${n}</b>${esc(l)}</span>`).join("");
    const rows = ids.map((id) => {
      const v = state.items[id];
      const opts = [1, 2, 3, 4, 5].map((n) => `<label><input type="radio" name="${id}" value="${n}" ${v === n ? "checked" : ""}><span aria-hidden="true">${n}</span><span class="sr">${esc(KIT.response_labels[n])}</span></label>`).join("");
      return `<fieldset class="item" id="q-${id}"><legend><span class="q"><span class="id">${id}</span><span>${esc(KIT.items[id])}</span></span></legend>
        <div class="seg">${opts}<label class="skip"><input type="radio" name="${id}" value="skip" ${v === "skip" ? "checked" : ""}><span>skip</span></label></div></fieldset>`;
    }).join("");
    const done = ITEM_IDS.filter((id) => state.items[id] !== undefined).length;
    return `<section aria-labelledby="h">
      <span class="eyebrow">personality inventory · ${page * PAGE + 1} to ${page * PAGE + ids.length} of ${ITEM_IDS.length}</span>
      <h1 id="h">Read each statement as completing "I..."</h1>
      <div class="progress" role="progressbar" aria-label="Inventory progress" aria-valuemin="0" aria-valuemax="${ITEM_IDS.length}" aria-valuenow="${done}"><i style="width:${(done / ITEM_IDS.length) * 100}%"></i></div>
      <div class="key" aria-hidden="true">${key}</div>
      ${rows}
      ${footline()}
    </section>`;
  }

  function screenScenarios() {
    const blocks = SCEN_IDS.map((id) => {
      const s = KIT.scenarios[id], a = state.scenarios[id] || {};
      const opts = Object.entries(s.options).map(([L, text]) => `<label class="opt"><input type="radio" name="${id}" value="${L}" ${a.choice === L ? "checked" : ""}><span class="L">${L}</span><span>${esc(text)}</span></label>`).join("");
      const n = scenWords(id);
      return `<fieldset class="scen" id="q-${id}"><legend class="sr">${id}: ${esc(s.wording)}</legend>
        <div class="head"><span class="id">${id}</span>${TEST.has(id) ? '<span class="chip test">test answer · held out</span>' : '<span class="chip">build</span>'}</div>
        <p class="wording" aria-hidden="true">${esc(s.wording)}</p>
        <div class="opts">${opts}</div>
        <div class="field"><div class="between"><label for="x-${id}">One sentence: why this choice?</label>
          <span class="count ${n > KIT.scenario_word_limit ? "over" : ""}" id="c-${id}" aria-live="polite">${n} / ${KIT.scenario_word_limit} words</span></div>
          <textarea id="x-${id}" data-scen="${id}" rows="2" aria-describedby="c-${id}">${esc(a.explanation || "")}</textarea></div>
      </fieldset>`;
    }).join("");
    return `<section aria-labelledby="h">
      <span class="eyebrow">workplace scenarios · 6</span>
      <h1 id="h">Choose what you would actually do</h1>
      <p class="lead">Choose A, B, C, or D. Give one sentence explaining your choice. Use no more than ${KIT.scenario_word_limit} words for the choice and explanation together. If no option fits exactly, choose the closest and say why. There is no right answer.</p>
      ${heldOut()}
      ${blocks}
      ${footline()}
    </section>`;
  }

  function screenWriting() {
    const blocks = WRIT_IDS.map((id) => {
      const t = state.writing[id] || "", n = words(t);
      return `<div class="scen" id="q-${id}">
        <div class="head"><span class="id">${id}</span>${TEST.has(id) ? '<span class="chip test">test answer · held out</span>' : '<span class="chip">build</span>'}</div>
        <label class="wording" for="w-${id}">${esc(KIT.writing[id])}</label>
        <textarea id="w-${id}" data-writ="${id}" rows="4" aria-describedby="c-${id}">${esc(t)}</textarea>
        <span class="count ${n > KIT.writing_word_limit ? "over" : ""}" id="c-${id}" aria-live="polite">${n} / ${KIT.writing_word_limit} words</span>
      </div>`;
    }).join("");
    return `<section aria-labelledby="h">
      <span class="eyebrow">writing samples · 4</span>
      <h1 id="h">Write the message you would actually send</h1>
      <p class="lead">One line is fine. Maximum ${KIT.writing_word_limit} words per message. Keep to the situation given. Leave out real names and personal details.</p>
      ${heldOut()}
      ${blocks}
      ${footline()}
    </section>`;
  }

  function screenReview() {
    const skipped = skippedIds(), fl = flags();
    const chip = (id) => `<button type="button" data-goto="${id}" aria-label="Go back to ${id}">${id}</button>`;
    return `<section aria-labelledby="h">
      <span class="eyebrow">review</span>
      <h1 id="h">Check before you finish</h1>
      <div class="stat">
        <div><b>${allIds().length - skipped.length}</b><span>of ${allIds().length} answered</span></div>
        <div><b>${skipped.length}</b><span>skipped</span></div>
        <div><b>${clock() || "0:00"}</b><span>so far</span></div>
      </div>
      <div class="panel"><h2>Skipped</h2>
        ${skipped.length ? `<p class="small">Skipping is fine. Tap one to go back to it.</p><div class="list">${skipped.map(chip).join("")}</div>` : '<p class="small">Nothing skipped.</p>'}
      </div>
      ${fl.length ? `<div class="panel"><h2>Flagged</h2><p class="small">Allowed as written. Fix them if you want to.</p><ul class="flags">${fl.map((f) => `<li>${esc(f)}</li>`).join("")}</ul></div>` : ""}
      <p class="small">Finish stops the timer and makes your two files.</p>
      ${footline()}
    </section>`;
  }

  function screenDone() {
    const build = answerFile(false), test = answerFile(true);
    let result = "";
    if (sendResult) {
      if (sendResult.kind === "ok") result = `<div class="result ok" role="status"><b>Saved to the team hub as ${esc(state.code)}.</b>${sendResult.problems.length ? `<span>Problems the hub found:</span><ul class="flags">${sendResult.problems.map((p) => `<li>${esc(p)}</li>`).join("")}</ul>` : "<span>No problems found.</span>"}</div>`;
      else if (sendResult.kind === "signin") result = `<div class="result warn" role="alert"><p>The hub needs your team sign-in first. <a href="/team" target="_blank" rel="noopener">Open the team hub</a>, enter the team code, then press Send again. Your answers stay in this browser.</p></div>`;
      else result = `<div class="result bad" role="alert"><p>${esc(sendResult.message)}</p></div>`;
    }
    return `<section aria-labelledby="h">
      <span class="eyebrow">done · ${esc(state.code)}</span>
      <h1 id="h">Kit finished in <em>${minutes()} minutes.</em></h1>
      <div class="stat">
        <div><b>${build.items.length + build.scenarios.length + build.writing.length}</b><span>build answers of 55</span></div>
        <div><b>${test.scenarios.length + test.writing.length}</b><span>test answers of 5</span></div>
        <div><b>${build.skipped.length + test.skipped.length}</b><span>skipped</span></div>
      </div>
      ${heldOut()}
      <div class="panel">
        <h2>Your two files</h2>
        <p class="small">build.json holds B01 to B50, S01, S03, S05, W01 and W03: the converter may use these. test.json holds only S02, S04, S06, W02 and W04. Both carry the kit time.</p>
        <div class="row">
          <a class="btn" id="dl-build" download="build.json" href="${fileUrl(false)}">Download build.json</a>
          <a class="btn" id="dl-test" download="test.json" href="${fileUrl(true)}">Download test.json</a>
        </div>
        <p class="small">Or press <b>Send to the team hub</b>: it sends both, using the team sign-in in this browser.</p>
        <div id="sendresult">${result}</div>
      </div>
      <div class="row"><button class="btn small" type="button" id="toreview">Change an answer</button></div>
      ${footline()}
    </section>`;
  }

  function footline() {
    const box = confirming ? `<div class="confirm" role="alertdialog" aria-labelledby="ch"><p id="ch">Clear every answer, your code and the timer from this browser? This cannot be undone.</p>
      <div class="row"><button class="btn" type="button" id="keep">Keep them</button><button class="btn danger" type="button" id="wipe">Clear my answers</button></div></div>` : "";
    return `<div class="footline"><span class="small">Saved in this browser as you go.</span><button class="btn small danger" type="button" id="clear">Clear my answers</button></div>${box}`;
  }

  // ---- render and navigation ----
  function render(focus) {
    const name = STEPS[state.step];
    dropUrls();
    if (name === "consent") main.innerHTML = screenConsent();
    else if (name === "code") main.innerHTML = screenCode();
    else if (name.startsWith("items")) main.innerHTML = screenItems(Number(name.slice(5)));
    else if (name === "scenarios") main.innerHTML = screenScenarios();
    else if (name === "writing") main.innerHTML = screenWriting();
    else if (name === "review") main.innerHTML = screenReview();
    else main.innerHTML = screenDone();
    main.classList.remove("spawn-in"); void main.offsetWidth; main.classList.add("spawn-in");
    const labels = { consent: "Start", code: "Start the kit", review: "Finish", done: "Send to the team hub" };
    next.textContent = labels[name] || "Next";
    back.classList.toggle("hidden", state.step === 0 || name === "done");
    next.disabled = name === "consent" && !state.consented;
    hint();
    renderPath();
    tick();
    if (focus) { if (typeof focus === "string") { const el = document.getElementById(focus); if (el) { el.scrollIntoView({ block: "center" }); const input = el.querySelector("input, textarea"); if (input) input.focus(); } } else { window.scrollTo(0, 0); main.focus({ preventScroll: true }); } }
  }

  // the section path in the top bar: where you are in the kit, not a menu
  const SECTIONS = [["agree", (n) => n === "consent"], ["code", (n) => n === "code"], ["statements", (n) => n.startsWith("items")],
    ["scenarios", (n) => n === "scenarios"], ["messages", (n) => n === "writing"], ["review", (n) => n === "review"], ["done", (n) => n === "done"]];
  const kitpath = document.getElementById("kitpath");
  function renderPath() {
    const name = STEPS[state.step];
    const here = SECTIONS.findIndex(([, test]) => test(name));
    kitpath.innerHTML = SECTIONS.map(([label], i) => `<li><span class="st${i === here ? " on" : ""}${i < here ? " done" : ""}"${i === here ? ' aria-current="step"' : ""}><span class="n">${i + 1}</span><span class="lbl">${label}</span></span></li>`).join("");
  }
  const nexthint = document.getElementById("nexthint");
  function hint() {
    const name = STEPS[state.step];
    nexthint.textContent = name === "consent" && !state.consented ? "Tick the box above to start." : "";
  }
  const kittimer = document.getElementById("kittimer");
  function tick() {
    const name = STEPS[state.step];
    const n = state.step + 1;
    const t = clock();
    const label = `step <b>${n}</b> of ${STEPS.length}`;
    if (steplabel.innerHTML !== label) steplabel.innerHTML = label;
    kittimer.textContent = t && name !== "consent" ? t : "";
  }
  setInterval(() => { if (state.startedAt && !state.finishedAt) tick(); }, 1000);

  function go(step, focus) { state.step = Math.max(0, Math.min(STEPS.length - 1, step)); flash = ""; confirming = false; save(); render(focus || true); }

  async function send() {
    next.disabled = true; next.setAttribute("aria-busy", "true"); next.textContent = "Sending...";
    try {
      const response = await fetch("/api/team/people", { method: "POST", credentials: "same-origin", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ code: state.code, build: answerFile(false), test: answerFile(true) }) });
      let body = {}; try { body = await response.json(); } catch (_) {}
      if (response.status === 401) sendResult = { kind: "signin" };
      else if (response.ok) { sendResult = { kind: "ok", problems: Array.isArray(body.problems) ? body.problems : [] }; state.sent = new Date().toISOString(); save(); }
      else sendResult = { kind: "error", message: "The hub did not save it: " + (body.error || "status " + response.status) + ". Your answers are kept in this browser." };
    } catch (_) {
      sendResult = { kind: "error", message: "Could not reach the team hub. Your answers are kept in this browser." };
    }
    next.disabled = false; next.removeAttribute("aria-busy");
    render(false);
    const box = document.getElementById("sendresult"); if (box) box.scrollIntoView({ block: "center" });
  }

  next.addEventListener("click", () => {
    const name = STEPS[state.step];
    if (name === "consent") { if (!state.consented) { flash = "Tick the box to agree, or choose No thanks."; return render(false); } return go(state.step + 1); }
    if (name === "code") {
      const code = (document.getElementById("code").value || "").trim();
      if (!CODE_RE.test(code)) { flash = "Use 2 to 32 letters, digits, - or _. No spaces, no real name."; render(false); document.getElementById("code").focus(); return; }
      state.code = code; return go(state.step + 1);
    }
    if (name === "review") { if (!state.finishedAt) { startTimer(); state.finishedAt = Date.now(); } sendResult = null; return go(state.step + 1); }
    if (name === "done") return send();
    go(state.step + 1);
  });
  back.addEventListener("click", () => go(state.step - 1));

  main.addEventListener("change", (event) => {
    const t = event.target;
    if (t.id === "agree") { state.consented = t.checked; flash = ""; next.disabled = !t.checked; hint(); save(); return; }
    if (t.type !== "radio") return;
    if (/^B\d\d$/.test(t.name)) { startTimer(); state.items[t.name] = t.value === "skip" ? "skip" : Number(t.value); }
    else if (/^S\d\d$/.test(t.name)) { startTimer(); state.scenarios[t.name] = Object.assign({}, state.scenarios[t.name], { choice: t.value }); updateCount(t.name); }
    save(); tick();
    if (/^B/.test(t.name)) { const bar = main.querySelector(".progress"); const done = ITEM_IDS.filter((id) => state.items[id] !== undefined).length; if (bar) { bar.setAttribute("aria-valuenow", done); bar.firstElementChild.style.width = (done / ITEM_IDS.length) * 100 + "%"; } }
  });

  function updateCount(id) {
    const el = document.getElementById("c-" + id); if (!el) return;
    const n = id[0] === "S" ? scenWords(id) : words(state.writing[id]);
    const limit = id[0] === "S" ? KIT.scenario_word_limit : KIT.writing_word_limit;
    el.textContent = n + " / " + limit + " words"; el.classList.toggle("over", n > limit);
  }

  main.addEventListener("input", (event) => {
    const t = event.target;
    if (t.dataset.scen) { startTimer(); state.scenarios[t.dataset.scen] = Object.assign({}, state.scenarios[t.dataset.scen], { explanation: t.value }); updateCount(t.dataset.scen); }
    else if (t.dataset.writ) { startTimer(); state.writing[t.dataset.writ] = t.value; updateCount(t.dataset.writ); }
    else if (t.id === "code") { flash = ""; const e = document.getElementById("codeerr"); if (e) e.textContent = ""; }
    else return;
    save(); tick();
  });

  main.addEventListener("click", (event) => {
    const t = event.target.closest("button"); if (!t) return;
    if (t.id === "decline") { state = blank(); save(); main.innerHTML = `<section aria-labelledby="h"><span class="eyebrow">no thanks</span><h1 id="h">Nothing was saved.</h1><p class="lead">That is fine, and it says nothing about you. You can close this page. If you change your mind, <a href="/kit">start again</a>.</p></section>`; back.classList.add("hidden"); next.disabled = true; steplabel.textContent = ""; kittimer.textContent = ""; kitpath.innerHTML = ""; nexthint.textContent = ""; document.getElementById("actionbar").classList.add("hidden"); return; }
    if (t.id === "clear") { confirming = true; render(false); const k = document.getElementById("keep"); if (k) k.focus(); return; }
    if (t.id === "keep") { confirming = false; render(false); return; }
    if (t.id === "wipe") { try { localStorage.removeItem(STORE); } catch (_) {} state = blank(); sendResult = null; confirming = false; flash = ""; render(true); return; }
    if (t.id === "toreview") return go(STEPS.indexOf("review"));
    if (t.dataset.goto) {
      const id = t.dataset.goto;
      const step = id[0] === "B" ? STEPS.indexOf("items" + Math.floor(ITEM_IDS.indexOf(id) / PAGE)) : STEPS.indexOf(id[0] === "S" ? "scenarios" : "writing");
      return go(step, "q-" + id);
    }
  });

  if (state.step >= STEPS.length) state.step = 0;
  if (STEPS[state.step] === "done" && !state.finishedAt) state.step = STEPS.indexOf("review");
  render(false);
})();
</script>
</body>
</html>
